  <rect x="5" y="14" width="54" height="42" rx="5" fill="#7a4b2a"/>
  <rect x="5" y="14" width="54" height="10" rx="5" fill="#8d5a34"/>
  <rect x="5" y="23" width="54" height="2" fill="#4a2e1a"/>
