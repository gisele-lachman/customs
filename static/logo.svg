  <circle cx="32" cy="42" r="8" fill="#f6efe0" stroke="#a8423a" stroke-width="1.4"/>
  <path d="M26 43 q2 -2 4 0 t4 0 t4 0" fill="none" stroke="#1f5c5c" stroke-width="1.4"/>
  <path d="M26 46 q2 -2 4 0 t4 0 t4 0" fill="none" stroke="#1f5c5c" stroke-width="1.4"/>
  <circle cx="51" cy="35" r="6.5" fill="#a8423a" stroke="#f6efe0" stroke-width="1.2"/>
  <path d="M51 30.5 l1.3 2.9 3.1 .3 -2.4 2 .8 3 -2.8 -1.6 -2.8 1.6 .8 -3 -2.4 -2 3.1 -.3z" fill="#f6efe0"/>
  <circle cx="49" cy="49" r="5" fill="#d9a441" stroke="#f6efe0" stroke-width="1"/>
  <circle cx="49" cy="49" r="2" fill="#f6efe0"/>
