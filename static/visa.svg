<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Visa, a friendly vintage flight attendant">
  <circle cx="32" cy="32" r="32" fill="#dcebe8"/>
  <!-- jacket, lapels and scarf -->
  <path d="M9 64 q2 -14 23 -16 q21 2 23 16z" fill="#1f5c5c"/>
  <path d="M22 50 l10 9 -3 5 h-9z M42 50 l-10 9 3 5 h9z" fill="#174848"/>
  <path d="M24 48.5 l8 6.5 8 -6.5 -3 -3 -5 3 -5 -3z" fill="#a8423a"/>
  <path d="M32 55 l-4 7 h3 l1 -3.5 1 3.5 h3z" fill="#8f342d"/>
  <circle cx="44" cy="56" r="1.3" fill="#d9a441"/>
  <!-- neck -->
  <rect x="28.5" y="40" width="7" height="8" rx="3" fill="#e2b48f"/>
  <!-- hair back: neat bob, dark grey with silver -->
  <path d="M19 32 q-1 -15 13 -15 q14 0 13 15 q0 7 -2 10 q-3 1.5 -4 -1 l0 -9 h-14 l0 9 q-1 2.5 -4 1 q-2 -3 -2 -10z" fill="#7d7873"/>
  <!-- face -->
  <ellipse cx="32" cy="32" rx="10" ry="11.5" fill="#ecc4a0"/>
  <!-- side-parted fringe -->
  <path d="M21.5 30 q0 -9 10.5 -10 q10 0 10.5 9 q-4 -5.5 -9 -5.2 q-3 2.6 -12 6.2z" fill="#7d7873"/>
  <!-- silver streaks -->
  <path d="M25 24.5 q4 -3.2 9 -3.4" fill="none" stroke="#e8e5e0" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M35 22.5 q4 1 6 4" fill="none" stroke="#e8e5e0" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M20.6 33 q-.6 4 1 8" fill="none" stroke="#e8e5e0" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M43.4 33 q.6 4 -1 8" fill="none" stroke="#e8e5e0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- pillbox cap perched on top, slightly tilted -->
  <g transform="rotate(-8 34 17)">
    <rect x="25" y="12" width="17" height="7" rx="2.5" fill="#1f5c5c"/>
    <rect x="25" y="16.2" width="17" height="2" fill="#a8423a"/>
    <path d="M30.5 14.2 h2.3 M35.2 14.2 h2.3" stroke="#d9a441" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="34" cy="14.2" r="1.3" fill="#d9a441"/>
  </g>
  <!-- eyes, brows, cheeks, smile -->
  <path d="M26.7 32 q1.5 -1.4 3 0 M34.3 32 q1.5 -1.4 3 0" fill="none" stroke="#3a2a20" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M26.3 29 q1.8 -.9 3.5 -.3 M34.2 28.7 q1.8 -.6 3.5 .3" fill="none" stroke="#6e6964" stroke-width="1" stroke-linecap="round"/>
  <path d="M29.4 31 q-1 .3 -1.6 .9" fill="none" stroke="#c9a284" stroke-width=".6"/>
  <circle cx="25.8" cy="36" r="2" fill="#e59a8a" opacity=".5"/>
  <circle cx="38.2" cy="36" r="2" fill="#e59a8a" opacity=".5"/>
  <path d="M28.2 37.2 q3.8 3.4 7.6 0" fill="none" stroke="#a8423a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- pearl earrings -->
  <circle cx="21.9" cy="35.5" r="1.1" fill="#fbf6ea"/>
  <circle cx="42.1" cy="35.5" r="1.1" fill="#fbf6ea"/>
</svg>
